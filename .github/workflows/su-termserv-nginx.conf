# mTLS-Proxy zum MII-Terminologieserver (SU-TermServ), Muster aus
# medizininformatik-initiative/mii-testdata (.github/workflows/su-termserv-nginx.conf).
# Der Publisher spricht http://127.0.0.1:8090/fhir; nginx terminiert die
# Client-Zertifikat-Authentifizierung gegen ontoserver.mii-termserv.de und
# haelt die Upstream-Verbindungen offen (keepalive), sonst kostet jede der
# tausenden Terminologieanfragen einen vollen TLS-Handshake.
events {
    worker_connections 1024;
}
http {
    log_format tx '$request_method $uri status=$status '
                  'connect=$upstream_connect_time response=$upstream_response_time';
    access_log /dev/stdout tx;
    upstream su_termserv {
        server ontoserver.mii-termserv.de:443;
        keepalive 16;
        keepalive_requests 100000;
        keepalive_timeout 300s;
    }
    server {
        listen 80;
        client_body_buffer_size 1m;
        client_max_body_size 5m;
        location / {
            proxy_pass https://su_termserv;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host ontoserver.mii-termserv.de;
            proxy_ssl_name ontoserver.mii-termserv.de;
            proxy_ssl_server_name on;
            proxy_ssl_session_reuse on;
            proxy_ssl_certificate /etc/nginx/certs/client-cert.pem;
            proxy_ssl_certificate_key /etc/nginx/certs/client-key.key;
        }
    }
}
